<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منظم الدواء</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2b6cb0">
</head>
<body>

  <header>
    <h1>💊 منظم مواعيد الدواء</h1>
    <div class="current-time" id="clock">00:00:00</div>
  </header>

  <!-- شاشة تنبيه منبثقة عند موعد الدواء -->
  <div id="alarm-modal" class="modal hidden">
    <div class="modal-content">
      <h2>⏰ حان وقت الدواء!</h2>
      <p id="alarm-med-name" class="alert-med-name"></p>
      <p id="alarm-med-dose" class="alert-med-dose"></p>
      <button id="btn-stop-alarm" class="btn-stop">أخذت الدواء (إيقاف المنبه)</button>
    </div>
  </div>

  <main>
    <!-- قسم التحكم في الصوت -->
    <section class="card volume-box">
      <label for="volumeSlider">🔊 مستوى صوت المنبه:</label>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1">
      <button id="btn-test-sound" class="btn-secondary">تجربة الصوت</button>
    </section>

    <!-- نموذج إضافة دواء جديد -->
    <section class="card form-box">
      <h2>إضافة دواء جديد</h2>
      <form id="med-form">
        <div class="input-group">
          <label>اسم الدواء:</label>
          <input type="text" id="med-name" placeholder="مثال: علاج الضغط" required>
        </div>
        <div class="input-group">
          <label>الجرعة / ملاحظة:</label>
          <input type="text" id="med-dose" placeholder="مثال: قرص واحد بعد الأكل" required>
        </div>
        <div class="input-group">
          <label>الميعاد:</label>
          <input type="time" id="med-time" required>
        </div>
        <button type="submit" class="btn-primary">+ حفظ الميعاد</button>
      </form>
    </section>

    <!-- قائمة المواعيد اليومية -->
    <section class="card list-box">
      <h2>أدويتي اليوم</h2>
      <ul id="med-list" class="med-list"></ul>
    </section>
  </main>

  <audio id="alarm-audio" loop preload="auto">
    <source src="alarm.mp3" type="audio/mpeg">
  </audio>

  <script src="app.js"></script>
</body>
</html>
