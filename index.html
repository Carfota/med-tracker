<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منظم الدواء</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2b6cb0">
</head>
<body>

  <header>
    <h1>💊 منظم مواعيد الدواء</h1>
    <div class="current-time" id="clock">12:00:00 ص</div>
  </header>

  <!-- شاشة المنبه المنبثقة -->
  <div id="alarm-modal" class="modal hidden">
    <div class="modal-content">
      <h2>⏰ حان وقت الدواء!</h2>
      <p id="alarm-med-name" class="alert-med-name"></p>
      <p id="alarm-med-dose" class="alert-med-dose"></p>
      
      <div class="alarm-actions">
        <button id="btn-stop-alarm" class="btn-stop">✅ أخذت الدواء</button>
        <button id="btn-snooze-alarm" class="btn-snooze">⏳ فكرني بعد 10 دقائق (غفوة)</button>
      </div>
    </div>
  </div>

  <main>
    <!-- قسم الصوت -->
    <section class="card volume-box">
      <h2>🔔 إعدادات صوت المنبه</h2>
      <div class="input-group">
        <label for="customAudioFile">اختر نغمة من الهاتف:</label>
        <input type="file" id="customAudioFile" accept="audio/*">
        <small id="audioStatusText" class="status-text">النغمة الحالية: النغمة الافتراضية</small>
      </div>

      <div class="input-group">
        <label for="volumeSlider">🔊 مستوى الصوت:</label>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1">
      </div>

      <button id="btn-test-sound" class="btn-secondary">تجربة الصوت</button>
    </section>

    <!-- نموذج إضافة دواء جديد -->
<section class="card form-box">
      <h2>إضافة ميعاد دواء</h2>
      <form id="med-form">
        <div class="input-group">
          <label>اسم الدواء:</label>
          <input type="text" id="med-name" placeholder="مثال: مضاد حيوي" required>
        </div>

        <div class="input-group">
          <label>الجرعة / ملاحظة:</label>
          <input type="text" id="med-dose" placeholder="مثال: قرص واحد بعد الطعام" required>
        </div>

        <!-- أوقات التنبيه (مرنة لإضافة أكثر من وقت باليوم) -->
        <div class="input-group">
          <label>مواعيد الجرعات في اليوم:</label>
          <div id="times-container">
            <div class="time-row">
              <input type="time" class="med-time-input" required>
            </div>
          </div>
          <button type="button" id="btn-add-time" class="btn-sm" style="margin-top: 8px;">+ إضافة ميعاد آخر لنفس الدواء</button>
        </div>

        <div class="input-group">
          <label>نظام التكرار:</label>
          <select id="med-recurrence">
            <option value="daily">يومياً</option>
            <option value="interval">كل عدة أيام (دوري: كل يومين، 3 أيام...)</option>
            <option value="weekly">أسبوعياً (يوم محدد في الأسبوع)</option>
            <option value="monthly">شهرياً (تاريخ محدد كل شهر)</option>
          </select>
        </div>

        <!-- حقل كل كام يوم -->
        <div class="input-group hidden" id="box-interval-days">
          <label>تكرار كل كام يوم؟</label>
          <input type="number" id="med-interval" min="2" max="30" value="2" placeholder="مثال: 2 يعني يوم ويوم، 3 يعني كل 3 أيام">
        </div>

        <div class="input-group hidden" id="box-weekly-day">
          <label>اختر اليوم من الأسبوع:</label>
          <select id="med-weekday">
            <option value="5">الجمعة</option>
            <option value="6">السبت</option>
            <option value="0">الأحد</option>
            <option value="1">الإثنين</option>
            <option value="2">الثلاثاء</option>
            <option value="3">الأربعاء</option>
            <option value="4">الخميس</option>
          </select>
        </div>

        <div class="input-group hidden" id="box-monthly-day">
          <label>تاريخ اليوم في الشهر (1 - 31):</label>
          <input type="number" id="med-monthday" min="1" max="31" value="1">
        </div>

        <button type="submit" class="btn-primary">+ حفظ الدواء والمواعيد</button>
      </form>
    </section>
    
    <!-- قائمة جدول اليوم -->
    <section class="card list-box">
      <h2>📋 جدول أدوية اليوم وحالتها</h2>
      <ul id="med-list" class="med-list"></ul>
    </section>

    <!-- السجل الدائم للتاريخ والالتزام -->
    <section class="card history-box">
      <div class="history-header">
        <h2>📜 سجل الالتزام الدائم</h2>
        <button id="btn-export-history" class="btn-sm">تحميل نسخة من السجل</button>
      </div>
      <p class="history-desc">جميع الجرعات المسجلة عبر الأيام والشهور:</p>
      <div class="history-scroll-container">
        <ul id="history-list" class="history-list"></ul>
      </div>
    </section>
  </main>

  <audio id="alarm-audio" loop preload="auto">
    <source src="alarm.mp3" type="audio/mpeg">
  </audio>

  <script src="app.js"></script>
</body>
</html>
